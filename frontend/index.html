<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Гид</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap');

  :root {
    color-scheme: light dark;
    --bg: #f5f5f5;
    --surface: #ffffff;
    --ink: #2b2b2b;
    --muted: #676767;
    --border: #eaeaea;
    --accent: #19bfb6;
    --accent-ink: #ffffff;
    --accent-soft: #e3f8f7;
    --accent2: #ff8562;
    --accent2-soft: #ffe9e2;
    --done: #19bfb6;
    --danger: #e2543f;
    --phone-bg: color-mix(in srgb, var(--accent) 10%, #ffffff);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1817;
      --surface: #16211f;
      --ink: #f2f1ee;
      --muted: #9aa6a4;
      --border: #263533;
      --accent: #29d6cc;
      --accent-ink: #06201e;
      --accent-soft: #16302e;
      --accent2: #ff9a7a;
      --accent2-soft: #33231d;
      --done: #29d6cc;
      --danger: #ff7a63;
      --phone-bg: color-mix(in srgb, var(--accent) 10%, #0c1d1c);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--phone-bg);
    color: var(--ink);
    font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-width: 560px;
    margin: 0 auto;
  }

  .screen { display: none; flex: 1; flex-direction: column; padding: 20px 18px 8px; }
  .screen.active { display: flex; }

  .h1 { font-family: 'Onest', sans-serif; font-size: 21px; margin: 0 0 3px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; line-height: 1.5; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 18px; flex-shrink: 0; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }

  .step-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .item {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    background: var(--surface);
  }
  .check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff;
  }
  .item.done .check { background: var(--done); border-color: var(--done); }
  .item-title { font-size: 14.5px; font-weight: 600; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; padding: 0 20px; }

  .detail .back { align-self: flex-start; border: none; background: none; color: var(--accent); font-weight: 600; font-size: 14.5px; padding: 0 0 12px; cursor: pointer; }
  .detail-img { width: 100%; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .detail-img img { width: 100%; display: block; object-fit: cover; max-height: 220px; }
  .detail-text { font-size: 14px; line-height: 1.6; color: var(--ink); }
  .detail-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .rich-link { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

  .substeps-title { font-family: 'Onest', sans-serif; font-weight: 600; font-size: 13px; color: var(--muted); margin: 4px 0 2px; text-transform: uppercase; letter-spacing: .03em; }
  .substep-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }

  .callout {
    background: var(--accent2-soft);
    border: 1px solid color-mix(in srgb, var(--accent2) 35%, transparent);
    border-radius: 13px;
    padding: 13px 15px;
  }
  .callout .label { font-family: 'Onest', sans-serif; font-weight: 600; font-size: 13.5px; color: var(--ink); margin-bottom: 3px; }
  .callout .text { font-size: 13.5px; line-height: 1.55; color: var(--muted); }

  .list-block { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .list-block li { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; }
  .list-block li::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    flex-shrink: 0; margin-top: 7px;
  }

  .attachment-list { display: flex; flex-direction: column; gap: 8px; }
  .attachment-chip {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    font-size: 13.5px; background: var(--surface); text-decoration: none; color: var(--ink);
  }
  .attachment-chip .thumb {
    width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; background: var(--accent-soft); font-size: 15px;
  }
  .attachment-chip .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .attachment-chip .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .complete-btn {
    margin-top: 14px; border: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; font-size: 14.5px; padding: 13px; cursor: pointer; flex-shrink: 0;
  }
  .complete-btn[disabled] { background: var(--done); opacity: .9; cursor: default; }

  .locked { align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 24px; }
  .locked .icon { font-size: 40px; }
  .locked h2 { font-family: 'Onest', sans-serif; font-size: 19px; margin: 0; }
  .locked p { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.55; }

  .loading { align-items: center; justify-content: center; }
  .loading p { color: var(--muted); font-size: 14px; }

  .materials-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; overflow-y: auto; }
  .material-row {
    border: 1px solid var(--border); border-radius: 13px; padding: 11px 13px;
    display: flex; align-items: center; gap: 11px; background: var(--surface); text-decoration: none; color: var(--ink);
  }
  .material-row .thumb {
    width: 38px; height: 38px; border-radius: 9px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; overflow: hidden;
  }
  .material-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .material-row .info { flex: 1; min-width: 0; }
  .material-row .info .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .material-row .info .step { font-size: 12px; color: var(--muted); }
  .material-row .get-btn {
    font-family: 'Onest', sans-serif; font-weight: 600; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); border: none; border-radius: 20px; padding: 7px 13px; flex-shrink: 0;
  }

  nav.bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottom-nav.hidden { display: none; }
  nav.bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; background: none; padding: 9px 4px 11px; cursor: pointer;
    font-family: 'Onest', sans-serif; font-size: 11px; color: var(--muted);
  }
  nav.bottom-nav button .nav-icon { font-size: 18px; line-height: 1; }
  nav.bottom-nav button.active { color: var(--accent); }
</style>
</head>
<body>

<div id="app">

  <div id="screen-loading" class="screen active loading">
    <p>Загрузка…</p>
  </div>

  <div id="screen-locked" class="screen locked">
    <div class="icon">🔒</div>
    <h2 id="locked-title">Доступ закончился</h2>
    <p id="locked-text">Срок доступа к гиду истёк. Чтобы продолжить, свяжитесь для продления.</p>
  </div>

  <div id="screen-list" class="screen">
    <h1 class="h1" id="app-title">Гид</h1>
    <p class="sub" id="progress-label">Пройдено 0 из 0 шагов</p>
    <div class="progress"><div id="progress-fill" style="width:0%"></div></div>
    <ul class="step-list" id="step-list"></ul>
    <div class="empty" id="empty" style="display:none;">Пока нет ни одного шага.</div>
  </div>

  <div id="screen-detail" class="screen detail">
    <button class="back" id="back-btn">‹ Назад</button>
    <div class="detail-img" id="detail-img" style="display:none;"></div>
    <h1 class="h1" id="detail-title"></h1>
    <div class="detail-body">
      <div class="detail-text" id="detail-text"></div>
      <div id="detail-blocks"></div>
      <div class="attachment-list" id="detail-files"></div>
      <div id="detail-substeps"></div>
    </div>
    <button class="complete-btn" id="complete-btn">Отметить шаг пройденным</button>
  </div>

  <div id="screen-materials" class="screen">
    <h1 class="h1">Материалы</h1>
    <p class="sub">Все файлы из шагов гида в одном месте</p>
    <ul class="materials-list" id="materials-list"></ul>
    <div class="empty" id="materials-empty" style="display:none;">Пока нет ни одного файла.</div>
  </div>

  <nav class="bottom-nav hidden" id="bottom-nav">
    <button class="nav-tab active" data-tab="list"><span class="nav-icon">📘</span>Уроки</button>
    <button class="nav-tab" data-tab="materials"><span class="nav-icon">🗂️</span>Материалы</button>
  </nav>

</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // Базовый адрес API — на проде замени на боевой поддомен бэкенда,
  // если фронт и бэк живут на разных поддоменах.
  const API_BASE = '/api';
  const initData = tg ? tg.initData : '';

  const screens = {
    loading: document.getElementById('screen-loading'),
    locked: document.getElementById('screen-locked'),
    list: document.getElementById('screen-list'),
    detail: document.getElementById('screen-detail'),
    materials: document.getElementById('screen-materials'),
  };
  const bottomNav = document.getElementById('bottom-nav');
  let activeTab = 'list';

  function showScreen(name) {
    Object.values(screens).forEach((el) => el.classList.remove('active'));
    screens[name].classList.add('active');
    bottomNav.classList.toggle('hidden', name === 'detail' || name === 'locked' || name === 'loading');
    if (name === 'list' || name === 'materials') {
      activeTab = name;
      document.querySelectorAll('.nav-tab').forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === name));
    }
  }

  document.querySelectorAll('.nav-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      renderTop();
      showScreen(activeTab);
    });
  });

  let appData = { appTitle: 'Гид', lockedTitle: '', lockedText: '', completeButtonText: 'Отметить шаг пройденным', steps: [] };
  let completed = new Set();
  let currentStep = null;
  let navStack = [];

  async function apiGet(path) {
    return fetch(API_BASE + path, { headers: { 'X-Telegram-Init-Data': initData } });
  }
  async function apiPost(path, body) {
    return fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
      body: JSON.stringify(body || {}),
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  // Простая разметка: **жирный** → <b>, [текст](ссылка) → <a>, переносы строк → <br>.
  function renderRichText(str) {
    const escaped = escapeHtml(str || '');
    const withLinks = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="rich-link">$1</a>');
    const withBold = withLinks.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    return withBold.replace(/\n/g, '<br>');
  }

  function fileIcon(kind) {
    return { image: '🖼️', video: '🎞️', pdf: '📄', file: '📎' }[kind] || '📎';
  }

  // Листовые шаги — те, что реально проходятся и считаются в прогресс.
  function flattenLeaves(list) {
    let out = [];
    (list || []).forEach((s) => {
      if (s.children && s.children.length) out = out.concat(flattenLeaves(s.children));
      else out.push(s);
    });
    return out;
  }
  function flattenAll(list) {
    let out = [];
    (list || []).forEach((s) => {
      out.push(s);
      if (s.children && s.children.length) out = out.concat(flattenAll(s.children));
    });
    return out;
  }

  function renderTop() {
    document.getElementById('app-title').textContent = appData.appTitle || 'Гид';
    document.getElementById('locked-title').textContent = appData.lockedTitle || 'Доступ закончился';
    document.getElementById('locked-text').textContent = appData.lockedText || 'Срок доступа к гиду истёк.';
  }

  function renderList() {
    const list = document.getElementById('step-list');
    const empty = document.getElementById('empty');
    list.innerHTML = '';
    const steps = appData.steps || [];
    if (steps.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      renderStepListInto(list, steps, '');
    }
    const leaves = flattenLeaves(steps);
    const doneCount = leaves.filter((s) => completed.has(s.id)).length;
    document.getElementById('progress-label').textContent = `Пройдено ${doneCount} из ${leaves.length} шагов`;
    document.getElementById('progress-fill').style.width = leaves.length ? `${(doneCount / leaves.length) * 100}%` : '0%';
  }

  function renderStepListInto(ul, list, numberPrefix) {
    list.forEach((s, i) => {
      const number = numberPrefix ? `${numberPrefix}.${i + 1}` : `${i + 1}`;
      const hasChildren = s.children && s.children.length > 0;
      const li = document.createElement('li');
      if (hasChildren) {
        const leaves = flattenLeaves(s.children);
        const done = leaves.filter((x) => completed.has(x.id)).length;
        li.className = 'item';
        li.innerHTML = `<div class="check" style="background:transparent;border-color:var(--border);color:var(--muted);font-size:10px;">${done}/${leaves.length}</div><div class="item-title">${number}. ${escapeHtml(s.title || 'Без названия')}</div>`;
        li.addEventListener('click', () => openStep(s, [s]));
      } else {
        li.className = 'item' + (completed.has(s.id) ? ' done' : '');
        li.innerHTML = `<div class="check">${completed.has(s.id) ? '✓' : ''}</div><div class="item-title">${number}. ${escapeHtml(s.title || 'Без названия')}</div>`;
        li.addEventListener('click', () => openStep(s, [s]));
      }
      ul.appendChild(li);
    });
  }

  function renderMaterials() {
    const list = document.getElementById('materials-list');
    const empty = document.getElementById('materials-empty');
    list.innerHTML = '';
    const rows = [];
    flattenAll(appData.steps || []).forEach((s) => {
      (s.attachments || []).filter((a) => a.includeInMaterials).forEach((a) => {
        rows.push({ attachment: a, stepTitle: s.title || 'Без названия' });
      });
    });
    if (rows.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      rows.forEach(({ attachment: a, stepTitle }) => {
        const li = document.createElement('li');
        li.className = 'material-row';
        const name = (a.file || '').split('/').pop();
        li.innerHTML = `
          <div class="thumb">${a.type === 'image' ? `<img src="${a.file}" alt="">` : fileIcon(a.type)}</div>
          <div class="info">
            <div class="name">${escapeHtml(name)}</div>
            <div class="step">${escapeHtml(stepTitle)}</div>
          </div>
          <a class="get-btn" href="${a.file}" target="_blank" rel="noopener" download>Скачать</a>
        `;
        list.appendChild(li);
      });
    }
  }

  function openStep(step, stack) {
    if (stack) navStack = stack;
    currentStep = step;
    document.getElementById('detail-title').textContent = step.title || 'Без названия';
    document.getElementById('detail-text').innerHTML = renderRichText(step.text || '');

    const blocksHolder = document.getElementById('detail-blocks');
    blocksHolder.innerHTML = '';
    (step.blocks || []).forEach((b) => {
      if (b.type === 'list') {
        const ul = document.createElement('ul');
        ul.className = 'list-block';
        (b.items || []).filter((i) => (i || '').trim()).forEach((item) => {
          const li = document.createElement('li');
          li.innerHTML = renderRichText(item);
          ul.appendChild(li);
        });
        if (ul.children.length) blocksHolder.appendChild(ul);
      } else if (b.type === 'callout') {
        const box = document.createElement('div');
        box.className = 'callout';
        box.innerHTML = `<div class="label">${renderRichText(b.label || '')}</div><div class="text">${renderRichText(b.text || '')}</div>`;
        blocksHolder.appendChild(box);
      } else if (b.type === 'text') {
        const p = document.createElement('div');
        p.className = 'detail-text';
        p.innerHTML = renderRichText(b.text || '');
        if (p.innerHTML.trim()) blocksHolder.appendChild(p);
      }
    });

    const attachments = step.attachments || [];
    const coverImage = attachments.find((a) => a.type === 'image');
    const imgHolder = document.getElementById('detail-img');
    if (coverImage) {
      imgHolder.innerHTML = `<img src="${coverImage.file}" alt="">`;
      imgHolder.style.display = '';
    } else {
      imgHolder.innerHTML = '';
      imgHolder.style.display = 'none';
    }

    const filesHolder = document.getElementById('detail-files');
    const restFiles = attachments.filter((a) => a !== coverImage);
    filesHolder.innerHTML = '';
    restFiles.forEach((a) => {
      const name = (a.file || '').split('/').pop();
      const chip = document.createElement('a');
      chip.className = 'attachment-chip';
      chip.href = a.file;
      chip.target = '_blank';
      chip.rel = 'noopener';
      chip.setAttribute('download', '');
      chip.innerHTML = `<div class="thumb">${a.type === 'image' ? `<img src="${a.file}" alt="">` : fileIcon(a.type)}</div><div class="name">${escapeHtml(name)}</div>`;
      filesHolder.appendChild(chip);
    });

    const substepsHolder = document.getElementById('detail-substeps');
    substepsHolder.innerHTML = '';
    const btn = document.getElementById('complete-btn');
    const hasChildren = step.children && step.children.length > 0;

    if (hasChildren) {
      btn.style.display = 'none';
      const title = document.createElement('div');
      title.className = 'substeps-title';
      title.textContent = 'Подшаги';
      const ul = document.createElement('ul');
      ul.className = 'substep-list';
      step.children.forEach((child, i) => {
        const li = document.createElement('li');
        li.className = 'item' + (completed.has(child.id) ? ' done' : '');
        li.innerHTML = `<div class="check">${completed.has(child.id) ? '✓' : ''}</div><div class="item-title">${i + 1}. ${escapeHtml(child.title || 'Без названия')}</div>`;
        li.addEventListener('click', () => openStep(child, navStack.concat([child])));
        ul.appendChild(li);
      });
      substepsHolder.append(title, ul);
    } else {
      btn.style.display = '';
      const done = completed.has(step.id);
      btn.textContent = done ? 'Шаг пройден ✓' : (appData.completeButtonText || 'Отметить шаг пройденным');
      btn.disabled = done;
    }

    showScreen('detail');
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    navStack.pop();
    if (navStack.length > 0) {
      openStep(navStack[navStack.length - 1], navStack);
    } else {
      renderList();
      showScreen(activeTab);
    }
  });

  document.getElementById('complete-btn').addEventListener('click', async () => {
    if (!currentStep || completed.has(currentStep.id)) return;
    const res = await apiPost('/progress', { stepId: currentStep.id });
    if (res.ok) {
      completed.add(currentStep.id);
      openStep(currentStep);
      renderList();
    }
  });

  async function init() {
    try {
      const [stepsRes, initRes] = await Promise.all([apiGet('/steps'), apiPost('/init')]);

      if (!initRes.ok) {
        showScreen('locked');
        return;
      }

      appData = await stepsRes.json();
      const initJson = await initRes.json();

      renderTop();

      if (initJson.access && initJson.access.expired) {
        showScreen('locked');
        return;
      }

      completed = new Set(initJson.completedSteps || []);
      renderList();
      renderMaterials();
      showScreen('list');
    } catch (e) {
      showScreen('locked');
    }
  }

  init();
})();
</script>
</body>
</html>
